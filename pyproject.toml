[project]
name = "meterproof"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
test = [
  "jsonschema==4.23.0",
  "rfc3339-validator==0.1.4",
  "pytest==8.3.5",
]
lint = [
  "ruff",
  "mypy==1.19.1",
]
db = [
  "alembic",
  "SQLAlchemy",
  "psycopg[binary]>=3,<4",
]
dbt = [
  "dbt-core>=1.11.17,<1.12",
  "dbt-postgres",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: requires the local Docker database profile"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
# W2-D9 allows a per-file exclusion when formatting this historical validator
# would require more than about 20 mechanical line changes.
extend-exclude = ["tools/meterproof/validate_overlay.py"]

[tool.ruff.lint.per-file-ignores]
# Keep the explicit Z-to-offset normalization in the contract timestamp parser.
"tests/contracts/test_expected_facts.py" = ["FURB162"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
explicit_package_bases = true
